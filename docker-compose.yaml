services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: hardened
    image: my_project:latest
    env_file:
      - ./config/.env
    volumes:
      # Local runtime inputs (models, data snapshots, etc.). Keep read-only by
      # default; use object storage or add an explicit named volume for durable writes.
      - ./artifacts:/app/artifacts:ro
      - ./config/config.yaml:/app/config/config.yaml:ro
    # Root filesystem is immutable at runtime. Ephemeral writes go to tmpfs.
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Resource limits should be adjusted to the actual workload. Without these a runaway process
    # can overload the host.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options: # 10*10m => 100MB max log size
        max-size: "10m"
        max-file: "10"
        compress: true
