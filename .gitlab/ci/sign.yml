# Sigstore / cosign keyless signing of the released image AND every
# attestation carried alongside it.
#
# Runs in its own file so the build job stays focused and so signing can be
# disabled or replaced (e.g. with `notation`) by editing this one file. The
# image plus its OCI 1.1 attachments (SBOM, SLSA provenance) are written by
# the `docker:` job; this job adds four *signed* artifacts:
#
#   1. A Sigstore signature on the image manifest digest itself
#      (`cosign sign`).
#   2. A signed in-toto attestation of type `vuln` carrying the Trivy
#      image-scan output as its predicate (`cosign attest --type vuln`,
#      consuming `cosign-vuln.json` from the `trivy-image:` job). Lets
#      downstream consumers re-verify, months later, that the released
#      image was built clean according to *this project's* scanner — no
#      need to trust CI logs.
#   3. A signed in-toto attestation of type `spdx` carrying the
#      buildx-generated SBOM (`cosign attest --type spdx`, consuming
#      `image-sbom.spdx.json` extracted by the `docker:` job).
#   4. A signed in-toto attestation of type `slsaprovenance` carrying
#      the BuildKit SLSA `mode=max` predicate (`cosign attest --type
#      slsaprovenance`, consuming `image-provenance.json` extracted by
#      the `docker:` job).
#
# The original OCI 1.1 referrers buildx wrote in step 0 stay in place —
# anyone can still discover them without cosign. This job just layers a
# Sigstore-anchored *signed* copy of each on top, so cosign-aware
# consumers can verify them against this project's OIDC identity.
#
# All four signed artifacts attach as OCI 1.1 referrers to the image
# digest. Each gets its own Fulcio cert + Rekor entry, so a compromise
# of one doesn't taint the others.
#
# How "keyless" works
# -------------------
# No long-lived signing key is stored anywhere. For each signing event
# (`sign` and `attest` are both signing events under the hood):
#   1. GitLab issues a short-lived OIDC token bound to this CI job's identity
#      (via the `id_tokens:` block below).
#   2. Cosign exchanges the OIDC token at Sigstore's Fulcio CA for an
#      ephemeral signing certificate valid for ~10 minutes.
#   3. The signing event (cert + signature digest) is recorded in Rekor, a
#      public append-only transparency log.
#   4. The ephemeral private key is destroyed; only the signature + Rekor
#      entry remain.
#
# Network egress required: fulcio.sigstore.dev, rekor.sigstore.dev,
# tuf-repo-cdn.sigstore.dev. No secrets, no manual key rotation.
#
# Verification (anywhere): see `make verify-image` (signature) and the
# `cosign verify-attestation --type vuln` snippet in docs/REPO_SETUP.md
# for the vuln attestation.

cosign-sign:
  stage: docker
  # Alpine + curl-installed cosign rather than the official cosign image,
  # because the official image is distroless and lacks the shell GitLab
  # Runner needs to run multi-line scripts. Renovate keeps both pinned.
  image: alpine:3.20
  needs:
    - job: docker
      artifacts: true
    # Gate signing on `trivy-image:` success AND pull its `cosign-vuln.json`
    # artifact for the attestation step. A failing image scan stops this
    # job from running, so no known-vulnerable build ever gets a Sigstore
    # signature OR a vuln attestation. The image is still in the registry
    # (buildx `--push` is atomic) but verifiers reject it for the missing
    # signature.
    - job: trivy-image
      artifacts: true
    - job: semantic-release
      artifacts: true
  rules:
    - if: '$RENOVATE == "true"'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    # renovate: datasource=github-releases depName=sigstore/cosign
    COSIGN_VERSION: "v2.4.3"
    COSIGN_YES: "true"
  before_script:
    - |
      if [ "$RELEASED" != "true" ]; then
        echo "No release, skipping signing"
        exit 0
      fi
    - apk add --no-cache curl ca-certificates
    - |
      curl -fsSL -o /usr/local/bin/cosign \
        "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
      chmod +x /usr/local/bin/cosign
      cosign version

    - echo "$CI_REGISTRY_PASSWORD" | cosign login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  after_script:
    - cosign logout "$CI_REGISTRY" || true
  script:
    - |
      if [ "$RELEASED" != "true" ]; then exit 0; fi
      IMAGE_REF="${IMAGE_NAME}@${IMAGE_DIGEST}"
      CERT_IDENTITY="^https://${CI_SERVER_HOST}/${CI_PROJECT_PATH}//"
      CERT_ISSUER="https://${CI_SERVER_HOST}"

      echo "Signing $IMAGE_REF"
      cosign sign --yes "$IMAGE_REF"

      # Attestations attach signed claims about the image. Each is an
      # independent DSSE-wrapped in-toto envelope with its own Fulcio
      # cert and Rekor entry. They are ordered after `sign` so a
      # failure here still leaves the image with a valid signature —
      # only the additional claim is missing, and `attest` is safely
      # re-runnable against the same digest without re-signing.
      echo "Attesting vulnerability scan (predicate: cosign-vuln.json)"
      cosign attest --yes \
        --predicate cosign-vuln.json \
        --type vuln \
        "$IMAGE_REF"

      echo "Attesting image SBOM (predicate: image-sbom.spdx.json)"
      cosign attest --yes \
        --predicate image-sbom.spdx.json \
        --type spdx \
        "$IMAGE_REF"

      echo "Attesting SLSA provenance (predicate: image-provenance.json)"
      cosign attest --yes \
        --predicate image-provenance.json \
        --type slsaprovenance \
        "$IMAGE_REF"

      echo "Verifying signature round-trip..."
      cosign verify \
        --certificate-identity-regexp "$CERT_IDENTITY" \
        --certificate-oidc-issuer "$CERT_ISSUER" \
        "$IMAGE_REF"

      echo "Verifying vuln attestation round-trip..."
      cosign verify-attestation \
        --type vuln \
        --certificate-identity-regexp "$CERT_IDENTITY" \
        --certificate-oidc-issuer "$CERT_ISSUER" \
        "$IMAGE_REF" > /dev/null

      echo "Verifying SBOM attestation round-trip..."
      cosign verify-attestation \
        --type spdx \
        --certificate-identity-regexp "$CERT_IDENTITY" \
        --certificate-oidc-issuer "$CERT_ISSUER" \
        "$IMAGE_REF" > /dev/null

      echo "Verifying provenance attestation round-trip..."
      cosign verify-attestation \
        --type slsaprovenance \
        --certificate-identity-regexp "$CERT_IDENTITY" \
        --certificate-oidc-issuer "$CERT_ISSUER" \
        "$IMAGE_REF" > /dev/null
