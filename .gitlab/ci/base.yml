stages:
  - quality
  - test
  - security
  - release

variables:
  UV_VERSION: "0.7"
  PYTHON_VERSION: "3.13"
  UV_CACHE_DIR: .uv-cache

.uv-base:
  image: ghcr.io/astral-sh/uv:${UV_VERSION}-python${PYTHON_VERSION}-bookworm-slim
  before_script:
    - uv sync --group dev --frozen
  cache:
    key: uv-${CI_COMMIT_REF_SLUG}
    paths:
      - ${UV_CACHE_DIR}
      - .venv/
