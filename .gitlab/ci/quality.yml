format-check:
  extends: .uv-base
  stage: quality
  script:
    - make format-check

lint-check:
  extends: .uv-base
  stage: quality
  script:
    - make lint-check

type-check:
  extends: .uv-base
  stage: quality
  script:
    - make type-check

docstring-check:
  extends: .uv-base
  stage: quality
  script:
    - make docstring-check

repo-check:
  extends: .uv-base
  stage: quality
  script:
    - make repo-check

spell-check:
  extends: .uv-base
  stage: quality
  script:
    - make spell-check

shell-check:
  extends: .uv-base
  stage: quality
  script:
    - make shell-check

find-secrets:
  stage: quality
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  tags:
    - dind
  rules:
    - if: '$RENOVATE == "true"'
      when: never
    - when: on_success
  script:
    - gitleaks detect --source . --verbose --redact # --redact avoids leaking secrets in CI
