py-audit:
  extends: .uv-base
  stage: security
  script:
    - make py-audit

# CycloneDX SBOM of the full repo. Stored as a CI artifact so it can be
# re-scanned later (`trivy sbom sbom.cdx.json`) against a newer
# vulnerability DB without rebuilding. Also the deliverable expected by
# EU CRA / US EO 14028-style compliance regimes.
sbom:
  extends: .uv-base
  stage: security
  script:
    - make sbom 
  artifacts:
    name: "sbom-$CI_COMMIT_SHORT_SHA"
    paths:
      - sbom.cdx.json
    reports:
      cyclonedx:
        - sbom.cdx.json
    expire_in: 1 year
    when: on_success

trivy:
  stage: security
  image:
    name: ghcr.io/aquasecurity/trivy:0.70.0
    entrypoint: [""]
  rules:
    - if: '$RENOVATE == "true"'
      when: never
    - when: on_success
  script:
    - trivy fs --vex openvex.json .

# Informational broad-severity scan. Bypasses `trivy.yaml` (which scopes the
# strict scan to HIGH/CRITICAL runtime deps) so it surfaces LOW/MEDIUM
# findings and dev-dep findings too. `allow_failure: true` keeps it
# non-blocking —> appears as a yellow warning in the pipeline UI rather than
# failing the release. The OpenVEX document still suppresses triaged CVEs.
trivy-full-report:
  stage: security
  image:
    name: ghcr.io/aquasecurity/trivy:0.70.0
    entrypoint: [""]
  allow_failure: true
  rules:
    - if: '$RENOVATE == "true"'
      when: never
    - when: on_success
  script:
    - trivy fs --severity LOW,MEDIUM,HIGH,CRITICAL --exit-code 1 --include-dev-deps --vex openvex.json .
