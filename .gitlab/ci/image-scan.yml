# Vulnerability scan of the BUILT Docker image.
#
# `trivy:` (in security.yml) scans the source repo.
# It cannot see what lands in the runtime image: base-image
# OS packages (libc, openssl, zlib, …), bytecode-compiled artifacts, or
# anything resolved at `docker build` time. This job closes that gap.
#
# Creates:
#   1. `container-scanning-report.json`: Findings appear in the MR
#      security widget and the project's
#      Vulnerability Report (uses /contrib/gitlab.tpl).
#   2. `cosign-vuln.json` trivy's `cosign-vuln` format, a predicate
#      compatible with the in-toto Vulnerability v0.2 spec.
#
# Policy invariant: the same OpenVEX document (`openvex.json` at the
# repo root) used in both fs and image scans, as well as py-audit
# => one suppression document

trivy-image:
  stage: docker
  image:
    name: ghcr.io/aquasecurity/trivy:0.70.0
    entrypoint: [""]
  needs:
    - job: docker
      artifacts: true
    - job: semantic-release
      artifacts: true
  rules:
    - if: '$RENOVATE == "true"'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    # Trivy reads these env vars to pull from private registries.
    # CI_REGISTRY_USER / CI_REGISTRY_PASSWORD give read access to this
    # project's own container registry, all this scan needs.
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    VEX_FILE: openvex.json
  script:
    - |
      if [ "$RELEASED" != "true" ]; then
        echo "No release, skipping image scan"
        exit 0
      fi

      # "IMG_REF" env var comes from the "docker" job:

      # Pass 1: GitLab-native report
      # `--exit-code 0` so the report is always written even if CVEs are
      # found, the strict pass at the end enforces the blocking decision.
      trivy image \
        --severity HIGH,CRITICAL \
        --vex "$VEX_FILE" \
        --exit-code 0 \
        --format template \
        --template '@/contrib/gitlab.tpl' \
        --output container-scanning-report.json \
        "$IMG_REF"
      # Pass 2: cosign-vuln predicate. Non-blocking
      # for the same reason as pass 1, gate decision lives in pass 3.
      trivy image \
        --severity HIGH,CRITICAL \
        --vex "$VEX_FILE" \
        --exit-code 0 \
        --format cosign-vuln \
        --output cosign-vuln.json \
        "$IMG_REF"
      # Pass 3: human-readable table for CI logs + blocking exit code.
      # Vuln DB is cached from earlier passes, so this is fast.
      trivy image \
        --severity HIGH,CRITICAL \
        --vex "$VEX_FILE" \
        --exit-code 1 \
        "$IMG_REF"
  artifacts:
    when: always
    expire_in: 1 year
    paths:
      - cosign-vuln.json
    reports:
      container_scanning: container-scanning-report.json
