default_install_hook_types: [pre-commit, commit-msg]

# Pre-commit philosophy: CHECK ONLY — hooks here verify but never modify files.
# To auto-fix issues locally, run `make fix` (or the per-tool targets:
# `make format`, `make lint`, `make repo-fix`). The same `make check` aggregate
# runs in CI, so what passes here passes there.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # `trailing-whitespace` and `end-of-file-fixer` are intentionally NOT
      # listed here — they are auto-fixers with no check-only mode. Use
      # `make repo-fix` to apply them.
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff-format
        args: [--check]
      - id: ruff
        # Default behavior is check-only (no `--fix`). To auto-fix locally,
        # run `make lint` or `make fix`.

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.9
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: make type-check
        language: system
        types: [python]
        pass_filenames: false

      - id: interrogate
        name: interrogate
        entry: make docstring-check
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: make test-cov
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: pip-audit
        name: pip-audit
        entry: make audit
        language: system
        pass_filenames: false
        always_run: true
