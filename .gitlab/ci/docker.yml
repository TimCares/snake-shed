# Builds and pushes the Docker image on every released version.

variables:
  # Full image path to push to (registry + optional sub-path). Defaults
  # to this project's GitLab container registry — works out of the box
  # for any GitLab project. For multi-image projects, append a sub-path:
  #   IMAGE_NAME: "$CI_REGISTRY_IMAGE/api"
  # For other registries (Docker Hub, GHCR, ECR …), override entirely
  # and provide registry credentials via the docker login below.
  IMAGE_NAME: $CI_REGISTRY_IMAGE

docker:
  stage: docker
  image: docker:29.5.2-cli
  services:
    - docker:29.5.2-dind-rootless
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs:
    - job: semantic-release
      artifacts: true
  rules:
    - if: '$RENOVATE == "true"'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - |
      if [ "$RELEASED" != "true" ]; then
        echo "No release, skipping docker build"
        exit 0
      fi
    # `--password-stdin` keeps the registry token out of `ps aux` /
    # process listings inside the runner. Passing -p on the command
    # line would leak it to anything reading /proc.
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # The default `docker` driver cannot persist BuildKit SBOM/provenance
    # attestations on pushed images. The `docker-container` driver runs a
    # separate BuildKit instance that can publish those extra attestation
    # manifests alongside the pushed image index.
    - docker buildx create --use --driver docker-container --name attestation-builder
    # `jq` is used below to extract the manifest digest from the buildx metadata file
    - apk add --no-cache jq
  script:
    # --push: publish the runnable image plus any BuildKit attestation
    #         manifests in one transaction. Regular `docker push` cannot add
    #         these build attestations after the fact.
    # --sbom=true: generate an SPDX SBOM of the image (via BuildKit's bundled
    #              syft scanner) and attach it as a BuildKit in-toto
    #              attestation manifest on the pushed image index.
    # --provenance=mode=max: attach SLSA build provenance (full materials:
    #                       base images, source repo + commit, build config).
    #                       `mode=min` is the default; max is needed for
    #                       SLSA L3 compliance.
    # --metadata-file: emit a JSON with the resulting manifest digest, which
    #                 is then used as an artifact
    - >-
      docker buildx build --push
      --sbom=true
      --provenance=mode=max
      --metadata-file image-metadata.json
      -t "$IMAGE_NAME:$VERSION"
      -t "$IMAGE_NAME:latest"
      .
    - echo "IMAGE_NAME=$IMAGE_NAME" > image.env
    - IMAGE_DIGEST=$(jq -r '."containerimage.digest"' image-metadata.json)
    - echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> image.env
    - IMG_REF="${IMAGE_NAME}@${IMAGE_DIGEST}"
    - echo "IMG_REF=$IMG_REF" >> image.env
    - |
      docker buildx imagetools inspect "$IMG_REF" \
        --format '{{json .SBOM.SPDX}}' > image-sbom.spdx.json
      docker buildx imagetools inspect "$IMG_REF" \
        --format '{{json .Provenance.SLSA}}' > image-provenance.json
      if [ ! -s image-sbom.spdx.json ] || [ "$(cat image-sbom.spdx.json)" = "null" ]; then
        echo "ERROR: buildx did not attach an SBOM to $IMG_REF" >&2
        exit 1
      fi
      if [ ! -s image-provenance.json ] || [ "$(cat image-provenance.json)" = "null" ]; then
        echo "ERROR: buildx did not attach SLSA provenance to $IMG_REF" >&2
        exit 1
      fi
  after_script:
    - docker logout "$CI_REGISTRY"
  artifacts:
    reports:
      dotenv: image.env
    paths:
      - image-metadata.json
      - image-sbom.spdx.json
      - image-provenance.json
