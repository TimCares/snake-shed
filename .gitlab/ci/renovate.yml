# Self-hosted Renovate runner.
#
# Activation (one-time, per-project):
#   1. Create a Project Access Token (or group/personal token) with scopes
#      `api` + `write_repository`, role at least `Developer`. Save it as a
#      masked, protected CI/CD variable named `RENOVATE_TOKEN`.
#   2. CI/CD -> Schedules -> New schedule:
#        - Description: "Renovate"
#        - Interval pattern: e.g. `0 2 * * 1` (Mon 02:00 UTC -> inside renovate window)
#        - Target branch: your default branch
#        - Variables: add `RENOVATE = true`
#   3. Optional manual run: Pipelines -> Run pipeline, set `RENOVATE = true`.
#
# Tuning lives in `renovate.json` at the repo root, not here.

renovate:
  stage: maintenance
  image:
    name: ghcr.io/renovatebot/renovate:latest
    entrypoint: [""]
  rules:
    - if: '$RENOVATE == "true"'
  variables:
    LOG_LEVEL: info
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_TOKEN: $RENOVATE_TOKEN
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_REPOSITORIES: '["$CI_PROJECT_PATH"]'
    RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate-bot@$CI_SERVER_HOST>"
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: "required"
  script:
    - renovate
