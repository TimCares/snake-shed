pip-audit:
  extends: .uv-base
  stage: security
  script:
    - make audit

gitleaks:
  extends: .uv-base
  stage: security
  script:
    - make secrets-check

trivy:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL .
  allow_failure: true

secret_detection:
  stage: security
