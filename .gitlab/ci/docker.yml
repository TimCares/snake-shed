# Builds and pushes the Docker image on every released version.

variables:
  IMAGE_NAME: my_project

docker:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  needs:
    - job: semantic-release
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - |
      if [ "$RELEASED" != "true" ]; then
        echo "No release, skipping docker build"
        exit 0
      fi
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker buildx build -t "$IMAGE_NAME:$VERSION" -t "$IMAGE_NAME:latest" .
    - docker push "$IMAGE_NAME:$VERSION"
    - docker push "$IMAGE_NAME:latest"
  after_script:
    - docker logout "$CI_REGISTRY"
