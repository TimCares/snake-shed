pip-audit:
  extends: .uv-base
  stage: security
  script:
    - make audit

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose --redact

trivy:
  stage: security
  image:
    name: ghcr.io/aquasecurity/trivy:0.69.3
    entrypoint: [""]
  script:
    - trivy fs .
