[project]
name = "my-project"
version = "0.1.0"
description = "Type your project description here."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Your Name" }]

dependencies = [
    "omegaconf>=2.3.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.16.2",
    "interrogate>=1.7.0",
    "pip-audit>=2.10.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "python-semantic-release>=10.5.3",
    "ruff>=0.15.14",
    "ty>=0.0.38",
]

[tool.uv]
constraint-dependencies = []
override-dependencies = []

# =============================================================================
# Building
# =============================================================================

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

# Layout: this project uses the standard "src layout" (PyPA-recommended).
# Source code lives under `src/<package>/` so the package can only be imported
# after install — this catches missing-file bugs in the wheel that a flat layout
# silently hides. `module-name` is the importable package name (what users write
# after `import ...`); it should match `[project].name` with hyphens replaced
# by underscores. `make bootstrap` rewrites both on first run.
#
# Adding subpackages as the project grows is purely additive — no config change
# needed. A common pattern is:
#   src/<package>/core/     domain logic
#   src/<package>/api/      HTTP/CLI entry points
#   src/<package>/config/   configuration
#   src/<package>/infra/    I/O, DB, external services
[tool.uv.build-backend]
module-name = "my_project"
module-root = "src"

# =============================================================================
# Ruff — Linting & Formatting
# =============================================================================

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]
exclude = ["tests/"]

[tool.ruff.lint]
select = [
    # --- Core ---
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    # --- Bug / Code-smell ---
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "PL",     # pylint
    "RUF",    # ruff-specific
    "PIE",    # flake8-pie
    "PERF",   # perflint
    "RET",    # flake8-return
    # --- Documentation / Typing ---
    "D",      # pydocstyle
    "ANN",    # flake8-annotations
    "TC",     # flake8-type-checking
    # --- Security ---
    "S",      # flake8-bandit (replaces standalone bandit)
    # --- Style ---
    "ARG",    # flake8-unused-arguments
    "A",      # flake8-builtins (prevent shadowing builtins)
    "ISC",    # flake8-implicit-str-concat
    "T20",    # flake8-print (catch stray print() calls)
    "PTH",    # flake8-use-pathlib
    "DTZ",    # flake8-datetimez
    "RSE",    # flake8-raise
    "TRY",    # tryceratops (exception handling)
    "LOG",    # flake8-logging
    # --- Testing ---
    "PT",     # flake8-pytest-style
]
ignore = [
    "E501",   # line length — handled by ruff formatter
    "D100",   # module docstrings — interrogate covers doc coverage
    "D104",   # __init__.py docstrings — unnecessary boilerplate
    "TRY003", # long exception messages — too strict for real-world code
    "ISC001", # implicit string concat single-line — conflicts with ruff formatter
    "PTH123", # Unnceessary verbose "Path.open" instead of "open" for files
    "ANN401", # Any not allowed for *args and **kwargs, leads to awkward code
]



[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true


# =============================================================================
# ty — Static Type Checking
# =============================================================================

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
include = ["src"]


# =============================================================================
# Interrogate — Docstring Coverage
# =============================================================================

[tool.interrogate]
paths = ["src"]
fail-under = 90
ignore-init-method = true
ignore-init-module = true
ignore-nested-functions = true
exclude = ["tests"]

# =============================================================================
# Pytest
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "-v",
    "--tb=short",
    "--durations=10",
]


# =============================================================================
# Coverage
# =============================================================================

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", "*/__*__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    'if __name__ == "__main__"',
]


# =============================================================================
# Semantic Release — CI version bumps, changelog, releases
# =============================================================================

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = """
    set -e
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""  # includes commands to avoid a stale uv.lock
build_command_env = []  # if the build commands needs variables from the env
commit_parser = "conventional"
commit_message = "chore(release): {version}\n\nSee CHANGELOG.md for more details. [skip ci]"
commit_author = "semantic-release <semantic-release@ci>"
tag_format = "v{version}"

[tool.semantic_release.remote]
type = "gitlab"  # or e.g. "github"
# domain = "your-domain-if-self-hosted"

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false

[tool.semantic_release.branches.alpha]
match = ".*"
prerelease_token = "alpha"
prerelease = true


# =============================================================================
# Commitizen — Local commit message format enforcement only
# =============================================================================

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
